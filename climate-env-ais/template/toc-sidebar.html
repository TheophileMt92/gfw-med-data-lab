<!-- Left sidebar table of contents and centred reading column for theme: none reports.
     Add to YAML: include-after-body: [template/footer.html, template/toc-sidebar.html] -->
<style>
  #report-main {
    max-width: 860px;
    margin: 0 auto;
    padding: 1rem 2rem 3rem;
    box-sizing: border-box;
  }
  #report-main img { max-width: 100%; height: auto; }
  #report-main pre { overflow-x: auto; }
  #report-main table { max-width: 100%; }
  #report-main td code { white-space: normal; overflow-wrap: anywhere; }

  #TOC {
    max-width: 860px;
    margin: 1.5rem auto 0;
    padding: 0 2rem;
    box-sizing: border-box;
    line-height: 1.35;
  }
  #TOC #toc-title {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-secondary);
    border: none;
    margin: 0 0 0.6rem;
    padding: 0 0 0 0.7rem;
  }
  #TOC ul { list-style: none; margin: 0; padding: 0; }
  #TOC ul ul { padding-left: 0.85rem; }
  #TOC a {
    display: block;
    padding: 0.22rem 0.7rem;
    border-left: 2px solid transparent;
    color: var(--text-secondary);
    font-size: 0.9rem;
    text-decoration: none;
  }
  #TOC ul ul a { font-size: 0.82rem; padding-top: 0.15rem; padding-bottom: 0.15rem; }
  #TOC a:hover { color: var(--accent); }
  #TOC a.active {
    color: var(--ocean-deep);
    font-weight: 600;
    border-left-color: var(--accent);
    background: rgba(26, 127, 168, 0.06);
  }

  /* Collapsible groups: Contents, Figures, Tables */
  #TOC details.toc-group { margin: 0 0 0.5rem; }
  #TOC details.toc-group > summary {
    list-style: none;
    cursor: pointer;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-secondary);
    padding: 0.3rem 0.7rem;
    user-select: none;
  }
  #TOC details.toc-group > summary::-webkit-details-marker { display: none; }
  #TOC details.toc-group > summary::before {
    content: "▸";
    display: inline-block;
    width: 1em;
    transition: transform 0.15s ease;
  }
  #TOC details.toc-group[open] > summary::before { transform: rotate(90deg); }
  #TOC details.toc-group > summary:hover { color: var(--accent); }
  #TOC details.toc-group > summary .toc-count { font-weight: 400; letter-spacing: 0; text-transform: none; opacity: 0.75; }
  #TOC ul.toc-floats a { font-size: 0.8rem; padding-top: 0.15rem; padding-bottom: 0.15rem; }
  #TOC ul.toc-floats a b { color: var(--ocean-deep); font-weight: 600; }
  #TOC a b.toc-num { color: var(--ocean-deep); font-weight: 700; }

  /* Collapsible major sections */
  #TOC li.toc-collapsible { position: relative; }
  #TOC li.toc-collapsible > a { padding-right: 1.6rem; }
  #TOC li.toc-collapsible > ul { display: none; }
  #TOC li.toc-collapsible.toc-open > ul { display: block; }
  #TOC .toc-caret {
    position: absolute; right: 0.2rem; top: 0.18rem;
    width: 1.3rem; height: 1.3rem; padding: 0; border: none; background: none;
    cursor: pointer; color: var(--text-secondary); font-size: 0.75rem; line-height: 1.3rem;
    transition: transform 0.15s ease;
  }
  #TOC .toc-caret:hover { color: var(--accent); }
  #TOC li.toc-open > .toc-caret { transform: rotate(90deg); }

  @media (max-width: 1199px) {
    #TOC ul ul { display: none; }
  }

  @media (min-width: 1200px) {
    #TOC {
      position: fixed;
      left: 1.25rem;
      top: 1rem;
      width: 270px;
      max-height: calc(100vh - 2rem);
      margin: 0;
      padding: 0.25rem 0.5rem 0.25rem 0;
      overflow-y: auto;
      border-left: 2px solid var(--rule);
      background: #ffffff;
      z-index: 20;
    }
    #report-main {
      margin-left: max(310px, calc(50vw - 275px));
      margin-right: auto;
    }
  }

  @media print {
    #TOC { display: none; }
    #report-main { margin: 0 auto; }
  }
</style>

<script>
(function () {
  var toc = document.getElementById('TOC');
  var title = document.getElementById('title-block-header');
  var footer = document.querySelector('footer.ocean-footer');
  var header = document.querySelector('.ocean-header');
  if (!title) return;

  // Wrap the report body in a <main> so it can be given a readable width
  var main = document.createElement('main');
  main.id = 'report-main';
  title.parentNode.insertBefore(main, title);
  var node = main.nextSibling;
  while (node && node !== footer) {
    var next = node.nextSibling;
    var skip = node.nodeType === 1 &&
      (node.tagName === 'SCRIPT' || node.tagName === 'STYLE' ||
       node.classList.contains('glightbox-container'));
    if (!skip) main.appendChild(node);
    node = next;
  }
  if (!toc) return;

  // Contents sits above the main column (sidebar on wide screens, via CSS)
  main.parentNode.insertBefore(toc, main);

  var wide = window.matchMedia('(min-width: 1200px)');
  var links = Array.prototype.slice.call(toc.querySelectorAll('a[href^="#"]'));

  // Collapsible groups: Contents (open), then lists of figures and tables (closed)
  function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
  function stored(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function group(key, label, count, openByDefault) {
    var d = document.createElement('details');
    d.className = 'toc-group';
    var s = stored('toc-' + key);
    d.open = s === null ? openByDefault : s === '1';
    var sum = document.createElement('summary');
    sum.textContent = label;
    if (count !== null) {
      var c = document.createElement('span');
      c.className = 'toc-count';
      c.textContent = ' (' + count + ')';
      sum.appendChild(c);
    }
    d.appendChild(sum);
    d.addEventListener('toggle', function () { store('toc-' + key, d.open ? '1' : '0'); });
    return d;
  }
  // Bold the section numbers (e.g. "2c.3") in the contents
  links.forEach(function (a) {
    var m = a.textContent.match(/^(\d+[a-z]?(?:\.\d+)*\.?)\s+(.*)$/);
    if (!m) return;
    a.textContent = '';
    var b = document.createElement('b');
    b.className = 'toc-num';
    b.textContent = m[1];
    a.appendChild(b);
    a.appendChild(document.createTextNode(' ' + m[2]));
  });
  var tocTitle = document.getElementById('toc-title');
  var tocList = toc.querySelector(':scope > ul');
  if (tocList) {
    var gContents = group('contents', tocTitle ? tocTitle.textContent : 'Contents', null, true);
    if (tocTitle) tocTitle.style.display = 'none';
    toc.insertBefore(gContents, tocList);
    gContents.appendChild(tocList);
  }
  // Major sections (1, 2a, 2b, 2c, 3, ...) fold their subsections; a caret toggles them,
  // and the section being read opens automatically
  if (tocList) {
    tocList.querySelectorAll(':scope > li').forEach(function (li) {
      if (!li.querySelector(':scope > ul')) return;
      li.classList.add('toc-collapsible');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'toc-caret';
      btn.textContent = '▸';
      btn.setAttribute('aria-label', 'Show or hide subsections');
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        li.classList.toggle('toc-open');
        btn.setAttribute('aria-expanded', li.classList.contains('toc-open'));
      });
      li.insertBefore(btn, li.firstChild.nextSibling);
    });
  }
  function floatList(prefix, key, label) {
    var items = [];
    document.querySelectorAll('#report-main [id^="' + prefix + '"].quarto-float').forEach(function (el) {
      var cap = el.querySelector(':scope > figure > figcaption.quarto-float-caption');
      if (!cap) return;
      var text = cap.textContent.replace(/\s+/g, ' ').trim();
      var m = text.match(/^((?:Figure|Table)\s*\d+)\s*:\s*(.*)$/);
      if (!m) return;
      var first = m[2].split(/\.\s/)[0].replace(/\.$/, '');
      if (first.length > 90) first = first.slice(0, 87).replace(/\s\S*$/, '') + '…';
      items.push({ id: el.id, num: m[1].replace('Figure', 'Fig.'), text: first, full: text });
    });
    if (!items.length) return;
    var g = group(key, label, items.length, false);
    var ul = document.createElement('ul');
    ul.className = 'toc-floats';
    items.forEach(function (it) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#' + it.id;
      a.title = it.full;
      var b = document.createElement('b');
      b.textContent = it.num;
      a.appendChild(b);
      a.appendChild(document.createTextNode(' ' + it.text));
      li.appendChild(a);
      ul.appendChild(li);
    });
    g.appendChild(ul);
    toc.appendChild(g);
  }
  floatList('fig-', 'figures', 'Figures');
  floatList('tbl-', 'tables', 'Tables');
  var targets = links.map(function (a) {
    return document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
  });

  // Keep the sidebar below the ocean banner and above the footer
  function place() {
    if (!wide.matches) { toc.style.top = ''; toc.style.maxHeight = ''; return; }
    var top = Math.max(16, (header ? header.getBoundingClientRect().bottom : 0) + 16);
    var bottom = Math.min(window.innerHeight,
      footer ? footer.getBoundingClientRect().top : window.innerHeight) - 16;
    toc.style.top = top + 'px';
    toc.style.maxHeight = Math.max(120, bottom - top) + 'px';
  }

  // Highlight the section currently being read
  var current = null;
  function spy() {
    var active = null;
    for (var i = 0; i < targets.length; i++) {
      if (targets[i] && targets[i].getBoundingClientRect().top < 140) active = links[i];
    }
    if (active === current) return;
    if (current) current.classList.remove('active');
    if (active) {
      active.classList.add('active');
      var sec = active.closest('li.toc-collapsible');
      if (sec && !sec.classList.contains('toc-open')) {
        document.querySelectorAll('#TOC li.toc-collapsible.toc-open').forEach(function (o) {
          if (o !== sec) o.classList.remove('toc-open');
        });
        sec.classList.add('toc-open');
      }
      if (wide.matches) {
        var t = active.offsetTop, h = active.offsetHeight;
        if (t < toc.scrollTop + 40) toc.scrollTop = t - 40;
        else if (t + h > toc.scrollTop + toc.clientHeight - 40) toc.scrollTop = t + h - toc.clientHeight + 40;
      }
    }
    current = active;
  }

  var ticking = false;
  function update() {
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(function () { place(); spy(); ticking = false; });
  }
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
})();
</script>
